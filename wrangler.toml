# WHL 竞猜系统 — Cloudflare Pages（前端 + API Functions）
# 部署前先创建 D1 并把 database_id 填进来（见 README.md）

name = "whl-guess"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "whl-guess"
database_id = "TODO_REPLACE_WITH_D1_ID"

# 赛事系统（whl-tournament）的 D1：共享账号只读其 user 表
[[d1_databases]]
binding = "TOUR_DB"
database_name = "whl"
database_id = "ec3cc695-70bc-47ab-a454-5ca62ec22dd6"

# 赛事系统的 KV：会话真源（sess:<token> -> {userId}），跨项目绑定同一命名空间
[[kv_namespaces]]
binding = "SESSION_KV"
id = "87e2d78308bc47e9b36dc6de53be0458"

[vars]
# SYNC_BASE_URL = "https://<tunnel-subdomain>.trycloudflare.com"   # 发奖目标（AstrBot 插件同步 API），部署时用 `wrangler pages secret put` 或 dashboard 配
